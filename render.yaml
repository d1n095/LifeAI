# Render Blueprint — single-container, 0 kr/mån MVP deployment.
#
# ONE Render Free web service (`LifeAI-1` — this is the service's REAL name as it exists in the
# Render dashboard today, confirmed by direct inspection 2026-07-19, serving
# https://lifeai-1.onrender.com). An earlier version of this file used `LifeAI` (without the
# `-1`), on the assumption that Render's hostname-uniqueness suffix ("lifeai" was taken, so the
# platform gave it the `lifeai-1` hostname) left the dashboard *name* unsuffixed. That assumption
# was wrong — the dashboard name itself is `LifeAI-1`. Render Blueprint sync matches an existing
# service by this exact `name` field; if it doesn't match, Render creates a NEW service instead
# of adopting the existing one (Render's own documented behavior appends a numeric suffix to the
# new resource specifically to avoid a collision with an existing same-named one — plausibly
# exactly how the live service ended up suffixed `-1` in the first place, from an earlier sync
# attempt against a mismatched Blueprint). See docs/RENDER_DEPLOY.md for the full account and
# citations. No separate backend service — Render Free doesn't offer a Private Service plan, and
# paying for a second service defeats the point of this architecture.
#
# Next.js and FastAPI run as sibling processes INSIDE this one container
# (Dockerfile.combined, scripts/entrypoint-combined.sh): Next.js binds publicly to $PORT,
# FastAPI binds only to 127.0.0.1:8000 — unreachable from outside the container by
# construction, without needing Render's Private Service type at all. The browser only ever
# talks to this one service; frontend/app/api/[...path]/route.ts proxies to FastAPI over
# loopback (INTERNAL_API_URL=http://127.0.0.1:8000).
#
# PostgreSQL (with pgvector) and Redis are NOT Render-managed here — Supabase Free and
# Upstash Free respectively, both external, both sync:false (real values entered manually,
# never committed). Qdrant is gone entirely — replaced by pgvector
# (backend/app/models/document_chunk.py, backend/app/rag/vector_store.py).
#
# NOTHING in this file deploys anything by itself — see docs/RENDER_DEPLOY.md for the
# click-path and every variable that needs a real value before first deploy. Deploys are
# still gated on CI (.github/workflows/ci.yml's deploy-render job), not a bare push.

services:
  - type: web
    name: LifeAI-1
    runtime: docker
    dockerfilePath: ./Dockerfile.combined
    dockerContext: .
    plan: free # verify this exact plan slug in the Render dashboard before applying — Postgres's "starter" plan name turned out to be legacy/rejected, confirm "free" is still current for web services too
    region: oregon
    branch: claude/det-kommer-mer-879lcm
    autoDeploy: false # see .github/workflows/ci.yml's deploy-render job — deploys only after CI is green. This field does NOT cover a Render Blueprint's own "Auto Sync" setting, which is a separate mechanism that can apply config (including a runtime change) and deploy on a push to this same branch independent of GitHub Actions — confirm Auto Sync is Off (manual sync) before ever pushing a change to this file. See docs/RENDER_DEPLOY.md.
    healthCheckPath: /api/health # deliberately checks the whole chain (Next.js -> loopback -> FastAPI -> Supabase/Upstash) — see backend/app/routers/health.py. Safe here specifically because scripts/entrypoint-combined.sh links both processes' lifecycle: if FastAPI is the reason this fails, the entrypoint already tears the whole container down on its own, so Render restarting on a failed health check isn't fighting that design, it's the same signal twice.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true # signs JWTs — platform-generated, never committed (app/config.py)

      - key: FOUNDER_EMAIL
        sync: false
      - key: FOUNDER_PASSWORD
        sync: false

      # Supabase Free Postgres (with pgvector) — external, not Render-managed, so Render
      # can't auto-wire these via fromDatabase the way it could for its own managed
      # Postgres. Use Supabase's SESSION POOLER connection string (Supavisor, session mode,
      # port 5432) — Direct connection is IPv6-only and unreachable from Render Free, which
      # has no outbound IPv6. Do NOT use the Transaction pooler (port 6543) — that mode
      # doesn't reliably support the session-level operations backend/scripts/security/ensure_app_role.py's
      # role-creation SQL and Alembic's DDL need. Session pooler's username is of the form
      # postgres.<project-ref>, a pooler login identity, not a real Postgres role — see
      # ensure_app_role.py's use of SELECT current_user and docs/RENDER_DEPLOY.md.
      - key: DATABASE_URL
        sync: false
      - key: MAINAI_APP_PASSWORD
        generateValue: true # backend/scripts/security/ensure_app_role.py runs the same way regardless of Direct vs. Session pooler — only which real role it ends up connected as changes, which is exactly why it asks Postgres (SELECT current_user) instead of assuming

      # Upstash Free Redis — external, sync:false for the same reason as DATABASE_URL above.
      - key: REDIS_URL
        sync: false

      # Loopback only — the whole point of this architecture (see top-of-file comment).
      # Not a secret, so a literal value, not sync:false.
      - key: INTERNAL_API_URL
        value: http://127.0.0.1:8000

      - key: FRONTEND_ORIGINS
        value: https://lifeai-1.onrender.com
      - key: PUBLIC_APP_URL
        value: https://lifeai-1.onrender.com

      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"

      # SMTP is mandatory in production (app/main.py's _check_smtp_configured). Strato's
      # smtp.strato.com uses implicit TLS/SSL on port 465, not STARTTLS — hence
      # SMTP_USE_SSL=true/SMTP_USE_TLS=false/port 465 below (see app/email.py and
      # app/main.py's _check_smtp_mode, which fails startup if both TLS modes are true).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "false"
      - key: SMTP_USE_SSL
        value: "true"
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: MainAI / Life OS

      - key: TOKEN_CLEANUP_RETENTION_DAYS
        value: "30"
      - key: ENABLE_SCHEDULED_CLEANUP
        value: "true"
      - key: CLEANUP_INTERVAL_HOURS
        value: "24"

      - key: DEFAULT_LLM_PROVIDER
        value: openai
      - key: DEFAULT_LLM_MODEL
        value: gpt-4o-mini
      - key: DEFAULT_EMBEDDING_PROVIDER
        value: openai
      - key: DEFAULT_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CHAT_FALLBACK_ORDER
        value: openai,anthropic,gemini
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
