# Strato VPS production topology — see docs/STRATO_VPS_DEPLOY.md for the full installation
# order. This is deliberately NOT docker-compose.yml (local dev): no local postgres/redis
# (Supabase Session Pooler / Upstash remain external, see the secrets file), no `build:`
# (images are built and pushed by GitHub Actions — see .github/workflows/build-images.yml —
# and only ever pulled here by digest), and only `caddy` publishes anything to the host.
#
# Security property this mirrors from Dockerfile.combined's loopback isolation (see the
# "ROTORSAK BEKRÄFTAD AV RENDER SUPPORT" section of docs/RENDER_DEPLOY.md for why that
# approach was abandoned): the backend is never directly reachable from outside the
# `lifeai_internal` Docker network. Here that's real network isolation instead of
# loopback-inside-one-container isolation — the pattern Render's own docs recommend
# (https://render.com/docs/faq#can-i-deploy-multiple-apps-to-a-single-render-service).
#
# LIFEAI_ENV_FILE lets docs/STRATO_VPS_DEPLOY.md's CI verification job point env_file at a
# throwaway file instead of the real root-owned /etc/lifeai/lifeai.env (which only exists on
# the actual VPS) — in production, leave it unset and the default applies.
#
# Container hardening (init/security_opt/cap_drop/read_only/tmpfs/pids_limit/mem_limit/cpus)
# is applied uniformly to all three services and verified against the REAL images in
# .github/workflows/ci.yml's vps-compose-verify job — see docs/VPS_DOCKER_HARDENING.md for
# what was evaluated, what was applied, and why. mem_limit/cpus below are conservative
# starting points sized for a small VPS, not a hard architectural ceiling — tune them to the
# real server's specs during the first deployment (docs/STRATO_VPS_DEPLOY.md).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 100
    mem_limit: 128m
    cpus: "0.50"
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?sätt DOMAIN i /etc/lifeai/lifeai.env, t.ex. lifeai.exempel.se}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - lifeai_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    # Digest-pinned, e.g. ghcr.io/d1n095/lifeai-backend@sha256:... — never a mutable tag like
    # :latest. See docs/STRATO_VPS_DEPLOY.md's "Första manuella deploy" section for why the
    # pin is chosen by Dennis explicitly, not auto-followed.
    image: ${BACKEND_IMAGE:?sätt BACKEND_IMAGE i /etc/lifeai/lifeai.env, t.ex. ghcr.io/d1n095/lifeai-backend@sha256:...}
    restart: unless-stopped
    init: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # /tmp is the ONLY thing this app writes to at runtime — scripts/ensure_app_role.py hands
    # its freshly-derived APP_DATABASE_URL back to docker-entrypoint.sh via a mktemp() file
    # (see that script's module docstring). Everything else (schema, RLS, session state) is
    # already in Postgres, not the container filesystem — verified by grepping the app for
    # any other open(..., "w"/"a") / mkdir / tempfile use outside test-only tooling.
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 200
    mem_limit: 512m
    cpus: "1.00"
    env_file:
      - ${LIFEAI_ENV_FILE:-/etc/lifeai/lifeai.env}
    environment:
      ENVIRONMENT: production
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lifeai_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Deliberately no `ports:` — same warning as backend/Dockerfile's own comment: this
    # container must never receive public ingress directly. Only reachable from other
    # containers on lifeai_internal (and even then, only the frontend's proxy route ever
    # calls it — see frontend/app/api/[...path]/route.ts).

  frontend:
    # Digest-pinned, e.g. ghcr.io/d1n095/lifeai-frontend@sha256:...
    image: ${FRONTEND_IMAGE:?sätt FRONTEND_IMAGE i /etc/lifeai/lifeai.env, t.ex. ghcr.io/d1n095/lifeai-frontend@sha256:...}
    restart: unless-stopped
    init: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # The standalone Next.js server serves pre-built static/server output and proxies
    # /api/* — it has no on-disk cache or upload target of its own in this app (uploads go
    # straight through to the backend, see frontend/app/api/[...path]/route.ts). A tmpfs
    # /tmp is kept as a safety net rather than a known requirement.
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 200
    mem_limit: 512m
    cpus: "1.00"
    env_file:
      - ${LIFEAI_ENV_FILE:-/etc/lifeai/lifeai.env}
    environment:
      # Docker DNS on lifeai_internal — same mechanism docker-compose.yml already uses
      # locally, just now crossing a real container boundary instead of a loopback one.
      INTERNAL_API_URL: http://backend:8000
      # Docker auto-injects HOSTNAME=<container id> into every container's environment.
      # Next.js's standalone server.js (frontend/Dockerfile's CMD) reads process.env.HOSTNAME
      # as its bind address when set, falling back to 0.0.0.0 only if it's unset — so without
      # this override it silently binds to whatever that hostname resolves to (this
      # container's own address on lifeai_internal) instead of all interfaces. Caddy's own
      # reverse_proxy still reaches it fine either way (Docker DNS resolves `frontend` to
      # that same address), but the healthcheck below — and anything else connecting via
      # loopback inside this container's own network namespace — would get ECONNREFUSED on
      # 127.0.0.1:3000 without this. Verified against the real image: see
      # .github/workflows/ci.yml's vps-compose-verify job history.
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # No curl/wget in node:20-slim (see frontend/Dockerfile) — Node itself is always
      # present, so use it directly instead of adding a package just for this. Logs the
      # actual status code or error to stdout/stderr (visible via `docker inspect
      # .State.Health.Log`) instead of exiting silently — a silent failure here gives no way
      # to tell a real app bug apart from "the server just isn't listening yet".
      test:
        [
          "CMD",
          "node",
          "-e",
          "const r=require('http').get({host:'127.0.0.1',port:3000,path:'/api/health',timeout:3000},res=>{console.log('status',res.statusCode);process.exit(res.statusCode===200?0:1)});r.on('timeout',()=>{console.error('timeout');r.destroy();process.exit(1)});r.on('error',e=>{console.error('error',e.message);process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lifeai_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Deliberately no `ports:` — only Caddy ever reaches this, via lifeai_internal.

networks:
  lifeai_internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
