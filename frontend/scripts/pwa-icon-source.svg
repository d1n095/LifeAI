<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff" />
      <stop offset="100%" stop-color="#3ce0ff" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Full-bleed base background (#05050a) so the maskable variant has no transparent corners. -->
  <rect width="1024" height="1024" fill="#05050a" />
  <circle cx="512" cy="440" r="420" fill="url(#glow)" />
  <!-- Orb kept within the maskable safe zone (center ~80%). -->
  <circle cx="512" cy="512" r="296" fill="url(#orb)" />
  <circle cx="512" cy="512" r="296" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="10" />
</svg>
