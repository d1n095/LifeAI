[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
# A hung test must FAIL with evidence, never sit silent until the 6-hour job cap. This suite has
# twice been killed after an hour with nothing to show for it: the timeout configuration below is
# the fix, not a retry.
#
# faulthandler_timeout dumps every thread's stack (and the test that owns them) when a single
# test exceeds this, then lets the run continue -- pure diagnostics, no pass/fail change.
faulthandler_timeout = 600
# pytest-timeout is the actual bound: 1200s is ~10x the slowest legitimate test here, and a test
# that exceeds it fails the run with a stack dump instead of hanging. `thread` (not `signal`)
# because the two observed hangs were blocked in psycopg2/libpq row-lock waits, where a signal
# handler only runs after the blocking call returns -- i.e. never.
timeout = 1200
timeout_method = thread
markers =
    backend: general backend unit/integration tests (no browser)
    security: RLS and session-security tests
    account: account-lifecycle and rate-limit tests
