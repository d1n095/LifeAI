[package]
name = "mainai-app"
version = "0.1.0"
description = "MainAI cross-platform shell (macOS + Android)"
authors = ["MainAI"]
edition = "2021"
rust-version = "1.77.2"

# The library crate holds the actual app (shared by desktop + the mobile entry point).
# The binary is a thin wrapper (src/main.rs); the mobile build uses the lib's #[mobile_entry_point].
[lib]
name = "mainai_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"

# The proxy transport. rustls so no system OpenSSL is required on any target.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled by Tauri's bundler for the custom-protocol (production) build.
custom-protocol = ["tauri/custom-protocol"]
