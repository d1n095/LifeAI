name: Examiner — PR340 Blueprint security

on:
  pull_request:
    branches:
      - claude/founder-alpha-blueprint-draft
    paths:
      - backend/tests/backend/test_blueprint_approval_security.py
      - .github/workflows/examiner-pr340-blueprint-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blueprint-approval-adversarial:
    name: Examiner — runtime GUC approval forgery
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_test
      APP_DATABASE_URL: postgresql://mainai_app:mainai_app_test_pw@localhost:5432/lifeos_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key
      FOUNDER_EMAIL: founder@lifeos.local
      FOUNDER_PASSWORD: TestFounderPassword123!
      FRONTEND_ORIGINS: http://127.0.0.1:3020
      PUBLIC_APP_URL: http://127.0.0.1:3020
      ENABLE_SCHEDULED_CLEANUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Run Blueprint approval adversarial tests
        run: python -m pytest tests/backend/test_blueprint_approval_security.py -v
        working-directory: backend
