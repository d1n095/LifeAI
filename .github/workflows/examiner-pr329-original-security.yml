name: Examiner — PR329 original retrieval security

on:
  pull_request:
    branches:
      - claude/det-kommer-mer-879lcm
    paths:
      - backend/tests/backend/rag/test_original_retrieval.py
      - .github/workflows/examiner-pr329-original-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-retrieval-covered-boundaries:
    name: Examiner — auth, storage-key and header boundaries
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env: &test_env
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_test
      APP_DATABASE_URL: postgresql://mainai_app:mainai_app_test_pw@localhost:5432/lifeos_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key
      FOUNDER_EMAIL: founder@lifeos.local
      FOUNDER_PASSWORD: TestFounderPassword123!
      FRONTEND_ORIGINS: http://127.0.0.1:3020
      PUBLIC_APP_URL: http://127.0.0.1:3020
      ENABLE_SCHEDULED_CLEANUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Run covered-boundary adversarial probes
        run: >-
          python -m pytest -v
          tests/backend/rag/test_original_retrieval.py::test_original_download_rejects_unauthenticated_session
          tests/backend/rag/test_original_retrieval.py::test_download_requires_founder
          tests/backend/rag/test_original_retrieval.py::test_cross_owner_retrieval_is_denied
          tests/backend/rag/test_original_retrieval.py::test_database_storage_key_cannot_traverse_storage_root
          tests/backend/rag/test_original_retrieval.py::test_http_content_disposition_rejects_header_injection
          tests/backend/rag/test_original_retrieval.py::test_corrupted_checksum_is_integrity_error
          tests/backend/rag/test_original_retrieval.py::test_retrieval_writes_an_audit_row
        working-directory: backend

  original-retrieval-integrity-anchor:
    name: Examiner — checksumless legacy object must fail closed
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env: *test_env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Run missing-integrity-anchor adversarial probe
        run: >-
          python -m pytest -v
          tests/backend/rag/test_original_retrieval.py::test_checksumless_legacy_original_fails_closed
        working-directory: backend
