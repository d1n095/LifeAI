name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to keep the queue short.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------------------
  # Frontend: static checks (no backend needed)
  # ---------------------------------------------------------------------------------------
  lint-and-typecheck:
    name: Frontend — TypeScript & ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npx eslint .
        working-directory: frontend

  npm-audit:
    name: Frontend — npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Fails the job on any high/critical vulnerability — moderate-and-below are tracked
      # but don't block (see docs/SECURITY_BLOCKERS.md for the current baseline).
      - run: npm audit --audit-level=high
        working-directory: frontend

  frontend-build:
    name: Frontend — build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [docker, vercel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Docker mode produces .next/standalone (see frontend/Dockerfile); Vercel mode must
      # NOT (Vercel's own build pipeline manages that) — see next.config.mjs's VERCEL
      # conditional and docs/AUTH_THREAT_MODEL.md-adjacent history of the NOT_FOUND bug this
      # guards against regressing.
      - name: Build (docker mode)
        if: matrix.mode == 'docker'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npx next build
          test -d .next/standalone || (echo "::error::.next/standalone was not produced in Docker mode" && exit 1)
      - name: Build (Vercel mode)
        if: matrix.mode == 'vercel'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          VERCEL: "1"
        run: |
          npx next build
          test -d .next/standalone && (echo "::error::.next/standalone WAS produced in Vercel mode (should not be)" && exit 1) || true

  # ---------------------------------------------------------------------------------------
  # Backend: pytest suites, three CI jobs mirroring tests/{backend,security,account}/
  # ---------------------------------------------------------------------------------------
  backend-tests:
    name: Backend — unit/integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_test
      APP_DATABASE_URL: postgresql://mainai_app:mainai_app_test_pw@localhost:5432/lifeos_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key
      FOUNDER_EMAIL: founder@lifeos.local
      FOUNDER_PASSWORD: TestFounderPassword123!
      FRONTEND_ORIGINS: http://127.0.0.1:3020
      PUBLIC_APP_URL: http://127.0.0.1:3020
      ENABLE_SCHEDULED_CLEANUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      # tests/conftest.py creates its own throwaway database and the restricted runtime
      # role (idempotently — mirrors backend/db-init/01-app-role.sh) before applying every
      # Alembic migration; nothing extra to provision here beyond the Postgres server itself.
      - run: python -m pytest tests/backend/ -v
        working-directory: backend

  rls-security-tests:
    name: Backend — RLS & session-security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_test
      APP_DATABASE_URL: postgresql://mainai_app:mainai_app_test_pw@localhost:5432/lifeos_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key
      FOUNDER_EMAIL: founder@lifeos.local
      FOUNDER_PASSWORD: TestFounderPassword123!
      FRONTEND_ORIGINS: http://127.0.0.1:3020
      PUBLIC_APP_URL: http://127.0.0.1:3020
      ENABLE_SCHEDULED_CLEANUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest tests/security/ -v
        working-directory: backend

  account-rate-limit-tests:
    name: Backend — account lifecycle & rate-limit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_test
      APP_DATABASE_URL: postgresql://mainai_app:mainai_app_test_pw@localhost:5432/lifeos_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key
      FOUNDER_EMAIL: founder@lifeos.local
      FOUNDER_PASSWORD: TestFounderPassword123!
      FRONTEND_ORIGINS: http://127.0.0.1:3020
      PUBLIC_APP_URL: http://127.0.0.1:3020
      ENABLE_SCHEDULED_CLEANUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest tests/account/ -v
        working-directory: backend

  # ---------------------------------------------------------------------------------------
  # Migration check: fresh install to head, then a simulated upgrade from the previous
  # schema with data preserved — see docs/OPERATIONS.md.
  # ---------------------------------------------------------------------------------------
  migration-check:
    name: Backend — Alembic migration check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Fresh install to head
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_migration_check
          APP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_migration_check
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS lifeos_migration_check;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE lifeos_migration_check;"
          alembic upgrade head
      - name: Downgrade to base and back up (round-trip check)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_migration_check
          APP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_migration_check
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Upgrade from the previous schema with data preserved
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_upgrade_check
          APP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_upgrade_check
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS lifeos_upgrade_check;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE lifeos_upgrade_check;"
          alembic upgrade 0002
          PGPASSWORD=postgres psql -h localhost -U postgres -d lifeos_upgrade_check -c "
            INSERT INTO users (id, email, password_hash, role, is_active, created_at)
            VALUES ('11111111-1111-1111-1111-111111111111', 'legacy@lifeos.local', 'fakehash', 'admin', true, '2026-01-01 10:00:00');
            INSERT INTO conversations (id, user_id, title, created_at, updated_at)
            VALUES ('22222222-2222-2222-2222-222222222222', '11111111-1111-1111-1111-111111111111', 'Gammal konversation', now(), now());
          "
          alembic upgrade head
          PGPASSWORD=postgres psql -h localhost -U postgres -d lifeos_upgrade_check -c "
            SELECT email, email_verified, sessions_valid_after IS NOT NULL AS has_baseline FROM users WHERE id = '11111111-1111-1111-1111-111111111111';
          " | grep -q "legacy@lifeos.local" || (echo "::error::pre-existing user row did not survive the upgrade" && exit 1)
          PGPASSWORD=postgres psql -h localhost -U postgres -d lifeos_upgrade_check -c "
            SELECT title FROM conversations WHERE id = '22222222-2222-2222-2222-222222222222';
          " | grep -q "Gammal konversation" || (echo "::error::pre-existing conversation row did not survive the upgrade" && exit 1)

  # ---------------------------------------------------------------------------------------
  # Full-stack Playwright E2E — real backend, real frontend, real browser.
  # ---------------------------------------------------------------------------------------
  e2e-tests:
    name: E2E — Playwright (full stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_e2e
      APP_DATABASE_URL: postgresql://mainai_app:mainai_app_e2e_pw@localhost:5432/lifeos_e2e
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_ORIGINS: http://127.0.0.1:3020
      PUBLIC_APP_URL: http://127.0.0.1:3020
      FOUNDER_EMAIL: founder@lifeos.local
      FOUNDER_PASSWORD: TestFounderPassword123!
      SECRET_KEY: ci-e2e-secret-key
      OPENAI_API_KEY: fake-key-for-e2e
      ENABLE_SCHEDULED_CLEANUP: "false"
      E2E_FOUNDER_PASSWORD: TestFounderPassword123!
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_e2e
      E2E_EMAIL_LOG_PATH: ${{ github.workspace }}/backend/e2e_test_emails.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: pip install -r requirements.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Create restricted database role and E2E database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'mainai_app') THEN
                CREATE ROLE mainai_app LOGIN PASSWORD 'mainai_app_e2e_pw';
              END IF;
            END
            \$\$;
          "
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS lifeos_e2e;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE lifeos_e2e;"
          psql -h localhost -U postgres -d lifeos_e2e -c "
            GRANT USAGE ON SCHEMA public TO mainai_app;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO mainai_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO mainai_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO mainai_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO mainai_app;
          "
      - run: alembic upgrade head
        working-directory: backend

      # No NEXT_PUBLIC_API_URL — same-origin proxy mode, matching every real deployment (see
      # frontend/lib/api.ts's comment on that var and playwright.config.ts's webServer entry,
      # which passes INTERNAL_API_URL to the started `next start` process at runtime).
      - run: npx next build
        working-directory: frontend

      # First pass: functional suites (auth, session-security, account lifecycle) run with
      # a generous login/register rate limit — they are not what's exercising that control
      # (rate-limit.spec.ts is, below) and must not be flaky because of it purely as a side
      # effect of how many /api/auth/login calls the suite happens to make in one window.
      - name: Start backend (functional test mode — generous rate limits)
        working-directory: backend
        env:
          RATE_LIMIT_LOGIN_PER_MINUTE: "1000"
          RATE_LIMIT_REGISTER_PER_MINUTE: "1000"
          RATE_LIMIT_FORGOT_PASSWORD_PER_MINUTE: "1000"
          RATE_LIMIT_RESET_PASSWORD_PER_MINUTE: "1000"
          RATE_LIMIT_VERIFY_EMAIL_PER_MINUTE: "1000"
        run: |
          nohup python scripts/run_e2e_backend.py > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8010/api/health && break
            sleep 1
          done
      - run: npx playwright test e2e/auth.spec.ts e2e/security.spec.ts e2e/account.spec.ts --project=chromium
        working-directory: frontend
      - name: Stop backend
        if: always()
        working-directory: backend
        run: kill "$(cat backend.pid)" 2>/dev/null || true

      # Second pass: rate-limit.spec.ts against the REAL default limits, on a clean backend
      # (fresh Redis counters) so it isn't polluted by the functional passes above.
      - name: Start backend (default rate limits)
        working-directory: backend
        run: |
          python -c "import redis; redis.from_url('redis://localhost:6379/0').flushdb()"
          nohup python scripts/run_e2e_backend.py > backend-ratelimit.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8010/api/health && break
            sleep 1
          done
      - run: npx playwright test e2e/rate-limit.spec.ts --project=chromium
        working-directory: frontend
      - name: Stop backend
        if: always()
        working-directory: backend
        run: kill "$(cat backend.pid)" 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: backend/*.log
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  # Same-origin API proxy (frontend/app/api/[...path]/route.ts) — a real browser against the
  # frontend's actual standalone production server (server.js, the same one Docker/Render
  # run), built WITHOUT NEXT_PUBLIC_API_URL so the browser can only reach the backend through
  # the proxy. A separate job (not an extra pass inside e2e-tests) because it needs its own,
  # differently-configured frontend build — `next build` bakes NEXT_PUBLIC_API_URL in, so the
  # cross-origin build e2e-tests uses can't be reused here. See docs/RENDER_DEPLOY.md.
  # ---------------------------------------------------------------------------------------
  same-origin-proxy-test:
    name: E2E — same-origin proxy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_proxy_e2e
      APP_DATABASE_URL: postgresql://mainai_app:mainai_app_e2e_pw@localhost:5432/lifeos_proxy_e2e
      REDIS_URL: redis://localhost:6379/0
      # The only frontend origin in this job is the proxy-mode server itself (port 3021 —
      # see frontend/playwright.proxy.config.ts). Nothing calls the backend cross-origin here.
      FRONTEND_ORIGINS: http://127.0.0.1:3021
      PUBLIC_APP_URL: http://127.0.0.1:3021
      FOUNDER_EMAIL: founder@lifeos.local
      FOUNDER_PASSWORD: TestFounderPassword123!
      SECRET_KEY: ci-e2e-secret-key
      OPENAI_API_KEY: fake-key-for-e2e
      ENABLE_SCHEDULED_CLEANUP: "false"
      E2E_FOUNDER_PASSWORD: TestFounderPassword123!
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_proxy_e2e
      E2E_EMAIL_LOG_PATH: ${{ github.workspace }}/backend/e2e_test_emails.jsonl
      # Read by frontend/app/api/[...path]/route.ts — the frontend server's own address for
      # reaching the backend, distinct from what the browser calls (see that file).
      INTERNAL_API_URL: http://127.0.0.1:8010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: pip install -r requirements.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Create restricted database role and E2E database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'mainai_app') THEN
                CREATE ROLE mainai_app LOGIN PASSWORD 'mainai_app_e2e_pw';
              END IF;
            END
            \$\$;
          "
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS lifeos_proxy_e2e;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE lifeos_proxy_e2e;"
          psql -h localhost -U postgres -d lifeos_proxy_e2e -c "
            GRANT USAGE ON SCHEMA public TO mainai_app;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO mainai_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO mainai_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO mainai_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO mainai_app;
          "
      - run: alembic upgrade head
        working-directory: backend

      # No NEXT_PUBLIC_API_URL — this is the whole point (see frontend/lib/api.ts).
      - run: npx next build
        working-directory: frontend
      # Required for `node .next/standalone/server.js` to serve CSS/JS/images correctly —
      # standalone output doesn't include them by default (see frontend/Dockerfile, which
      # does the same two copies for the real image).
      - name: Assemble standalone server output
        working-directory: frontend
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Start backend
        working-directory: backend
        run: |
          nohup python scripts/run_e2e_backend.py > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8010/api/health && break
            sleep 1
          done
      - run: npx playwright test --config=playwright.proxy.config.ts --project=chromium
        working-directory: frontend
      - name: Stop backend
        if: always()
        working-directory: backend
        run: kill "$(cat backend.pid)" 2>/dev/null || true

      - name: Upload Playwright report (proxy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-proxy
          path: frontend/playwright-report-proxy/
          retention-days: 14
      - name: Upload backend logs (proxy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs-proxy
          path: backend/*.log
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  # Combined-container verification — builds and runs the REAL Dockerfile.combined image
  # (the one Render Free would actually run), not a stand-in. Deliberately NOT part of
  # all-checks-passed's `needs:` (so it can't gate deploy-render or become a required check on
  # every push to claude/**) and gated to only run on the dedicated validation branch — see
  # docs/RENDER_DEPLOY.md. Nothing here can trigger a Render deploy: deploy-render's own `if`
  # only matches the exact ref claude/det-kommer-mer-879lcm, which this branch is not.
  # ---------------------------------------------------------------------------------------
  combined-container-verify:
    name: Combined container — build, run, verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/claude/verify-combined-container'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_FOUNDER_PASSWORD: TestFounderPassword123!
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_combined_ci
      E2E_EMAIL_LOG_PATH: ${{ github.workspace }}/e2e-data/e2e_test_emails.jsonl
      # Container-internal DB/Redis addresses use host.docker.internal (see --add-host below)
      # — the postgres/redis *services* above publish to the RUNNER's own network stack, not
      # to any Docker bridge network our own `docker run` container is on.
      CONTAINER_DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/lifeos_combined_ci
      CONTAINER_REDIS_URL: redis://host.docker.internal:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Create database for the combined-container run
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS lifeos_combined_ci;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE lifeos_combined_ci;"

      - name: Build the real Dockerfile.combined image
        run: docker build -f Dockerfile.combined -t lifeai-combined:ci .

      - name: Prepare shared email-log directory
        run: |
          mkdir -p e2e-data
          chmod 777 e2e-data

      # ---- Container A: infra checks (health, loopback isolation, port exposure, crash) ----
      # ENVIRONMENT is deliberately left unset (defaults to "development") in every docker run
      # below, not "production" — app/main.py's _check_smtp_configured() fail-closed gate
      # requires a real SMTP_HOST whenever ENVIRONMENT=production, which would defeat the point
      # of E2E_MOCK_MODE's dev-email-log fake (see backend/scripts/run_e2e_backend.py).
      # Everything else this job verifies (loopback isolation, proxy, signals, crash-linkage,
      # CSRF/cookie/auth logic) is unaffected by this flag. A bash comment MUST NOT be placed
      # inside a backslash-continued docker run flag list below (a `#` there prematurely
      # terminates the continued command and drops the image argument) — this note stays here
      # instead, once, for all three containers.
      - name: Start container A (infra checks)
        run: |
          docker run -d --name lifeai-a \
            --add-host=host.docker.internal:host-gateway \
            -p 3020:3000 \
            -v "${{ github.workspace }}/e2e-data:/app/e2e-data" \
            -e SECRET_KEY=ci-combined-secret-key \
            -e DATABASE_URL="$CONTAINER_DATABASE_URL" \
            -e MAINAI_APP_PASSWORD=ci_combined_app_pw \
            -e REDIS_URL="$CONTAINER_REDIS_URL" \
            -e FOUNDER_EMAIL=founder@lifeos.local \
            -e FOUNDER_PASSWORD=TestFounderPassword123! \
            -e FRONTEND_ORIGINS=http://localhost:3020 \
            -e PUBLIC_APP_URL=http://localhost:3020 \
            -e PORT=3000 \
            -e E2E_MOCK_MODE=true \
            -e E2E_EMAIL_LOG_PATH=/app/e2e-data/e2e_test_emails.jsonl \
            lifeai-combined:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3020/api/health && break
            sleep 2
          done
          curl -sS http://localhost:3020/api/health

      - name: Verify loopback isolation (backend bound to 127.0.0.1 only, inside its own netns)
        run: |
          docker exec lifeai-a sh -c "cat /proc/net/tcp" | tee /tmp/lifeai-a-tcp.txt
          # 1F40 = 8000 in hex. A listener line's local-address field is HEXIP:HEXPORT.
          grep -q "0100007F:1F40" /tmp/lifeai-a-tcp.txt || (echo "::error::backend is not listening on 127.0.0.1:8000 inside the container" && exit 1)
          ! grep -q "00000000:1F40" /tmp/lifeai-a-tcp.txt || (echo "::error::backend is ALSO listening on 0.0.0.0:8000 — not loopback-only" && exit 1)

      - name: Verify port 8000 is not reachable from outside the container
        run: |
          docker port lifeai-a
          if docker port lifeai-a | grep -q 8000; then
            echo "::error::port 8000 is published — it must never be" && exit 1
          fi
          CONTAINER_IP=$(docker inspect -f '{{.NetworkSettings.IPAddress}}' lifeai-a)
          if curl -sf --max-time 3 "http://$CONTAINER_IP:8000/api/health" > /dev/null; then
            echo "::error::backend answered on its bridge-network IP:8000 — loopback-only isolation is broken" && exit 1
          fi
          echo "Confirmed: $CONTAINER_IP:8000 is unreachable (connection refused/timeout), as expected."

      - name: Verify crash of one process tears down the whole container
        run: |
          BACKEND_PID=$(docker logs lifeai-a 2>&1 | grep -oP 'backend pid=\K[0-9]+')
          echo "Killing backend pid=$BACKEND_PID inside the container..."
          # kill is a shell builtin, not a standalone binary in this minimal image — `docker
          # exec` without a shell tries to exec it directly and fails with "executable file
          # not found in $PATH". Route it through sh (always present) instead.
          docker exec lifeai-a sh -c "kill -9 $BACKEND_PID"
          timeout 15 docker wait lifeai-a
          docker logs lifeai-a 2>&1 | tail -30
          docker logs lifeai-a 2>&1 | grep -q "tearing down the other" || (echo "::error::entrypoint did not log the expected crash-linkage message" && exit 1)
          docker ps -a --filter name=lifeai-a --format '{{.Status}}'
          docker rm -f lifeai-a || true

      # ---- Container B: functional E2E (auth/registration/chat + adapted security tests),
      #      generous rate limits so the suite itself isn't what triggers a 429 ----
      - name: Start container B (functional E2E — generous rate limits)
        run: |
          docker run -d --name lifeai-b \
            --add-host=host.docker.internal:host-gateway \
            -p 3020:3000 \
            -v "${{ github.workspace }}/e2e-data:/app/e2e-data" \
            -e SECRET_KEY=ci-combined-secret-key \
            -e DATABASE_URL="$CONTAINER_DATABASE_URL" \
            -e MAINAI_APP_PASSWORD=ci_combined_app_pw \
            -e REDIS_URL="$CONTAINER_REDIS_URL" \
            -e FOUNDER_EMAIL=founder@lifeos.local \
            -e FOUNDER_PASSWORD=TestFounderPassword123! \
            -e FRONTEND_ORIGINS=http://localhost:3020 \
            -e PUBLIC_APP_URL=http://localhost:3020 \
            -e PORT=3000 \
            -e E2E_MOCK_MODE=true \
            -e E2E_EMAIL_LOG_PATH=/app/e2e-data/e2e_test_emails.jsonl \
            -e RATE_LIMIT_LOGIN_PER_MINUTE=1000 \
            -e RATE_LIMIT_REGISTER_PER_MINUTE=1000 \
            -e RATE_LIMIT_FORGOT_PASSWORD_PER_MINUTE=1000 \
            -e RATE_LIMIT_RESET_PASSWORD_PER_MINUTE=1000 \
            -e RATE_LIMIT_VERIFY_EMAIL_PER_MINUTE=1000 \
            lifeai-combined:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3020/api/health && break
            sleep 2
          done
          curl -sS http://localhost:3020/api/health

      - name: Registration through the proxy actually works (curl, before the browser suite)
        run: |
          RES=$(curl -sS -o /dev/null -w "%{http_code}" -X POST http://localhost:3020/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"curl-smoke-test@example.com","password":"Test1234Password!","website":""}')
          [ "$RES" = "202" ] || (echo "::error::expected 202 from /api/auth/register through the proxy, got $RES" && exit 1)

      - name: Run adapted security + auth + account E2E against the real container
        working-directory: frontend
        env:
          E2E_FRONTEND_URL: http://localhost:3020
          E2E_BACKEND_DIRECT_PORT: "8000"
        run: npx playwright test --config=playwright.combined.config.ts e2e/auth.spec.ts e2e/security.spec.ts e2e/account.spec.ts --project=chromium

      - name: Stop container B (verifies graceful SIGTERM shutdown)
        run: |
          docker stop --time 10 lifeai-b
          docker logs lifeai-b 2>&1 | tail -30
          docker logs lifeai-b 2>&1 | grep -q "shutdown complete" || (echo "::error::entrypoint did not log a clean shutdown — did it actually get SIGKILLed instead of shutting down on SIGTERM?" && exit 1)
          EXIT_CODE=$(docker inspect lifeai-b --format '{{.State.ExitCode}}')
          # 143 = 128+15 (SIGTERM), see scripts/entrypoint-combined.sh's trap. 137 (128+9,
          # SIGKILL) would mean Docker's grace period expired before the entrypoint's own
          # cleanup finished — a real regression, not a pass.
          [ "$EXIT_CODE" = "143" ] || (echo "::error::expected exit code 143 (graceful SIGTERM), got $EXIT_CODE" && exit 1)
          docker rm -f lifeai-b || true

      # ---- Container C: rate-limit.spec.ts against the REAL default limits ----
      - name: Flush Redis before the rate-limit pass
        run: docker run --rm --add-host=host.docker.internal:host-gateway redis:7-alpine redis-cli -h host.docker.internal flushall

      - name: Start container C (default rate limits)
        run: |
          docker run -d --name lifeai-c \
            --add-host=host.docker.internal:host-gateway \
            -p 3020:3000 \
            -e SECRET_KEY=ci-combined-secret-key \
            -e DATABASE_URL="$CONTAINER_DATABASE_URL" \
            -e MAINAI_APP_PASSWORD=ci_combined_app_pw \
            -e REDIS_URL="$CONTAINER_REDIS_URL" \
            -e FOUNDER_EMAIL=founder@lifeos.local \
            -e FOUNDER_PASSWORD=TestFounderPassword123! \
            -e FRONTEND_ORIGINS=http://localhost:3020 \
            -e PUBLIC_APP_URL=http://localhost:3020 \
            -e PORT=3000 \
            -e E2E_MOCK_MODE=true \
            lifeai-combined:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3020/api/health && break
            sleep 2
          done

      - name: Run rate-limit.spec.ts against the real container
        working-directory: frontend
        env:
          E2E_FRONTEND_URL: http://localhost:3020
        run: npx playwright test --config=playwright.combined.config.ts e2e/rate-limit.spec.ts --project=chromium

      - name: Stop container C
        if: always()
        run: docker rm -f lifeai-c || true

      # ---- Container D: startup race — proves scripts/entrypoint-combined.sh's health-gated
      # frontend startup against the REAL image, not just by reading the script. Verified
      # production bug: frontend previously started (and Next's proxy began accepting public
      # traffic) concurrently with backend, so any request arriving before FastAPI finished
      # role provisioning + migrations + uvicorn boot got ECONNREFUSED -> 502.
      # TEST_DELAY_BACKEND_STARTUP_SECONDS (see the entrypoint script) reproduces that slow
      # boot on demand. ----
      - name: Start container D (delayed backend startup)
        run: |
          docker run -d --name lifeai-d \
            --add-host=host.docker.internal:host-gateway \
            -p 3021:3000 \
            -e SECRET_KEY=ci-combined-secret-key \
            -e DATABASE_URL="$CONTAINER_DATABASE_URL" \
            -e MAINAI_APP_PASSWORD=ci_combined_app_pw \
            -e REDIS_URL="$CONTAINER_REDIS_URL" \
            -e FOUNDER_EMAIL=founder@lifeos.local \
            -e FOUNDER_PASSWORD=TestFounderPassword123! \
            -e FRONTEND_ORIGINS=http://localhost:3021 \
            -e PUBLIC_APP_URL=http://localhost:3021 \
            -e PORT=3000 \
            -e E2E_MOCK_MODE=true \
            -e TEST_DELAY_BACKEND_STARTUP_SECONDS=10 \
            lifeai-combined:ci

      - name: Verify the frontend refuses connections while backend startup is delayed
        run: |
          sleep 4
          docker logs lifeai-d 2>&1 | grep -q "TEST HOOK: delaying backend startup" || (echo "::error::delay hook did not engage — this test isn't exercising the race at all" && exit 1)
          if curl -sf --max-time 2 http://localhost:3021/api/health > /dev/null; then
            echo "::error::frontend accepted a connection before backend became healthy — the startup race is back" && exit 1
          fi
          if docker logs lifeai-d 2>&1 | grep -q "frontend pid="; then
            echo "::error::frontend was started before the backend health check passed" && exit 1
          fi
          echo "Confirmed: no listener on :3021 and frontend not started while backend startup is delayed, as expected."

      - name: Verify the frontend starts and serves traffic once backend becomes healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3021/api/health && break
            sleep 1
          done
          curl -sS http://localhost:3021/api/health
          docker logs lifeai-d 2>&1 | grep -q "backend is healthy" || (echo "::error::entrypoint never logged that the backend became healthy" && exit 1)
          docker logs lifeai-d 2>&1 | grep -q "frontend pid=" || (echo "::error::frontend never started even after the backend became healthy" && exit 1)
          docker logs lifeai-d 2>&1 | tail -20

      - name: Verify a backend that never becomes healthy fails the whole container clearly
        run: |
          docker rm -f lifeai-d || true
          docker run -d --name lifeai-d-timeout \
            --add-host=host.docker.internal:host-gateway \
            -e SECRET_KEY=ci-combined-secret-key \
            -e DATABASE_URL="$CONTAINER_DATABASE_URL" \
            -e MAINAI_APP_PASSWORD=ci_combined_app_pw \
            -e REDIS_URL="$CONTAINER_REDIS_URL" \
            -e FOUNDER_EMAIL=founder@lifeos.local \
            -e FOUNDER_PASSWORD=TestFounderPassword123! \
            -e FRONTEND_ORIGINS=http://localhost:3022 \
            -e PUBLIC_APP_URL=http://localhost:3022 \
            -e PORT=3000 \
            -e E2E_MOCK_MODE=true \
            -e TEST_DELAY_BACKEND_STARTUP_SECONDS=999 \
            -e BACKEND_HEALTH_CHECK_TIMEOUT_SECONDS=5 \
            lifeai-combined:ci
          timeout 30 docker wait lifeai-d-timeout
          docker logs lifeai-d-timeout 2>&1 | tail -20
          docker logs lifeai-d-timeout 2>&1 | grep -q "aborting startup, never starting the frontend" || (echo "::error::entrypoint did not log a clear timeout abort" && exit 1)
          if docker logs lifeai-d-timeout 2>&1 | grep -q "frontend pid="; then
            echo "::error::frontend started even though the backend health check timed out" && exit 1
          fi
          EXIT_CODE=$(docker inspect lifeai-d-timeout --format '{{.State.ExitCode}}')
          [ "$EXIT_CODE" = "1" ] || (echo "::error::expected exit code 1 (clear health-check-timeout abort), got $EXIT_CODE" && exit 1)
          docker rm -f lifeai-d-timeout || true

      - name: Stop container D
        if: always()
        run: docker rm -f lifeai-d lifeai-d-timeout || true

      - name: Upload Playwright report (combined container)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-combined
          path: frontend/playwright-report-combined/
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  # Single required status check for branch protection — see docs/OPERATIONS.md for how to
  # wire "Require status checks to pass before merging" to this job.
  # ---------------------------------------------------------------------------------------
  all-checks-passed:
    name: All required checks passed
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - npm-audit
      - frontend-build
      - backend-tests
      - rls-security-tests
      - account-rate-limit-tests
      - migration-check
      - e2e-tests
      - same-origin-proxy-test
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more required checks failed."
            exit 1
          fi
          echo "All required checks passed."

  # ---------------------------------------------------------------------------------------
  # Render deploy — the ONLY thing that ever triggers a Render deploy for this stack.
  # render.yaml sets autoDeploy: false on both Render web services specifically so a push
  # alone can never deploy; this job is gated on all-checks-passed and only runs for pushes
  # to the production branch (not PRs, not other branches). It's a safe no-op until
  # RENDER_BACKEND_DEPLOY_HOOK_URL / RENDER_FRONTEND_DEPLOY_HOOK_URL are added as GitHub
  # Actions secrets — see docs/RENDER_DEPLOY.md. Each hook is independent: either, both, or
  # neither can be configured without failing this job.
  # ---------------------------------------------------------------------------------------
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: all-checks-passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/det-kommer-mer-879lcm' && needs.all-checks-passed.result == 'success'
    steps:
      - name: Trigger backend deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "RENDER_BACKEND_DEPLOY_HOOK_URL is not set — skipping backend deploy. See docs/RENDER_DEPLOY.md."
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL"
          echo "Backend deploy triggered."
      - name: Trigger frontend deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "RENDER_FRONTEND_DEPLOY_HOOK_URL is not set — skipping frontend deploy. See docs/RENDER_DEPLOY.md."
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL"
          echo "Frontend deploy triggered."
