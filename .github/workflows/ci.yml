name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to keep the queue short.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------------------
  # Frontend: static checks (no backend needed)
  # ---------------------------------------------------------------------------------------
  lint-and-typecheck:
    name: Frontend — TypeScript & ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npx eslint .
        working-directory: frontend

  npm-audit:
    name: Frontend — npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Fails the job on any high/critical vulnerability — moderate-and-below are tracked
      # but don't block (see docs/SECURITY_BLOCKERS.md for the current baseline).
      - run: npm audit --audit-level=high
        working-directory: frontend

  frontend-build:
    name: Frontend — build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [docker, vercel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Docker mode produces .next/standalone (see frontend/Dockerfile); Vercel mode must
      # NOT (Vercel's own build pipeline manages that) — see next.config.mjs's VERCEL
      # conditional and docs/AUTH_THREAT_MODEL.md-adjacent history of the NOT_FOUND bug this
      # guards against regressing.
      - name: Build (docker mode)
        if: matrix.mode == 'docker'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npx next build
          test -d .next/standalone || (echo "::error::.next/standalone was not produced in Docker mode" && exit 1)
      - name: Build (Vercel mode)
        if: matrix.mode == 'vercel'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          VERCEL: "1"
        run: |
          npx next build
          test -d .next/standalone && (echo "::error::.next/standalone WAS produced in Vercel mode (should not be)" && exit 1) || true

  # ---------------------------------------------------------------------------------------
  # Backend: pytest suites, three CI jobs mirroring tests/{backend,security,account}/
  # ---------------------------------------------------------------------------------------
  backend-tests:
    name: Backend — unit/integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_test
      APP_DATABASE_URL: postgresql://mainai_app:mainai_app_test_pw@localhost:5432/lifeos_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key
      ADMIN_EMAIL: admin@lifeos.local
      ADMIN_PASSWORD: TestAdminPassword123!
      FRONTEND_ORIGINS: http://127.0.0.1:3020
      PUBLIC_APP_URL: http://127.0.0.1:3020
      ENABLE_SCHEDULED_CLEANUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      # tests/conftest.py creates its own throwaway database and the restricted runtime
      # role (idempotently — mirrors backend/db-init/01-app-role.sh) before applying every
      # Alembic migration; nothing extra to provision here beyond the Postgres server itself.
      - run: python -m pytest tests/backend/ -v
        working-directory: backend

  rls-security-tests:
    name: Backend — RLS & session-security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_test
      APP_DATABASE_URL: postgresql://mainai_app:mainai_app_test_pw@localhost:5432/lifeos_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key
      ADMIN_EMAIL: admin@lifeos.local
      ADMIN_PASSWORD: TestAdminPassword123!
      FRONTEND_ORIGINS: http://127.0.0.1:3020
      PUBLIC_APP_URL: http://127.0.0.1:3020
      ENABLE_SCHEDULED_CLEANUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest tests/security/ -v
        working-directory: backend

  account-rate-limit-tests:
    name: Backend — account lifecycle & rate-limit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_test
      APP_DATABASE_URL: postgresql://mainai_app:mainai_app_test_pw@localhost:5432/lifeos_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key
      ADMIN_EMAIL: admin@lifeos.local
      ADMIN_PASSWORD: TestAdminPassword123!
      FRONTEND_ORIGINS: http://127.0.0.1:3020
      PUBLIC_APP_URL: http://127.0.0.1:3020
      ENABLE_SCHEDULED_CLEANUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest tests/account/ -v
        working-directory: backend

  # ---------------------------------------------------------------------------------------
  # Migration check: fresh install to head, then a simulated upgrade from the previous
  # schema with data preserved — see docs/OPERATIONS.md.
  # ---------------------------------------------------------------------------------------
  migration-check:
    name: Backend — Alembic migration check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Fresh install to head
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_migration_check
          APP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_migration_check
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS lifeos_migration_check;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE lifeos_migration_check;"
          alembic upgrade head
      - name: Downgrade to base and back up (round-trip check)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_migration_check
          APP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_migration_check
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Upgrade from the previous schema with data preserved
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_upgrade_check
          APP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_upgrade_check
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS lifeos_upgrade_check;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE lifeos_upgrade_check;"
          alembic upgrade 0002
          PGPASSWORD=postgres psql -h localhost -U postgres -d lifeos_upgrade_check -c "
            INSERT INTO users (id, email, password_hash, role, is_active, created_at)
            VALUES ('11111111-1111-1111-1111-111111111111', 'legacy@lifeos.local', 'fakehash', 'admin', true, '2026-01-01 10:00:00');
            INSERT INTO conversations (id, user_id, title, created_at, updated_at)
            VALUES ('22222222-2222-2222-2222-222222222222', '11111111-1111-1111-1111-111111111111', 'Gammal konversation', now(), now());
          "
          alembic upgrade head
          PGPASSWORD=postgres psql -h localhost -U postgres -d lifeos_upgrade_check -c "
            SELECT email, email_verified, sessions_valid_after IS NOT NULL AS has_baseline FROM users WHERE id = '11111111-1111-1111-1111-111111111111';
          " | grep -q "legacy@lifeos.local" || (echo "::error::pre-existing user row did not survive the upgrade" && exit 1)
          PGPASSWORD=postgres psql -h localhost -U postgres -d lifeos_upgrade_check -c "
            SELECT title FROM conversations WHERE id = '22222222-2222-2222-2222-222222222222';
          " | grep -q "Gammal konversation" || (echo "::error::pre-existing conversation row did not survive the upgrade" && exit 1)

  # ---------------------------------------------------------------------------------------
  # Full-stack Playwright E2E — real backend, real frontend, real browser.
  # ---------------------------------------------------------------------------------------
  e2e-tests:
    name: E2E — Playwright (full stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_e2e
      APP_DATABASE_URL: postgresql://mainai_app:mainai_app_e2e_pw@localhost:5432/lifeos_e2e
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_ORIGINS: http://127.0.0.1:3020
      PUBLIC_APP_URL: http://127.0.0.1:3020
      ADMIN_EMAIL: admin@lifeos.local
      ADMIN_PASSWORD: TestAdminPassword123!
      SECRET_KEY: ci-e2e-secret-key
      OPENAI_API_KEY: fake-key-for-e2e
      ENABLE_SCHEDULED_CLEANUP: "false"
      E2E_ADMIN_PASSWORD: TestAdminPassword123!
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_e2e
      E2E_EMAIL_LOG_PATH: ${{ github.workspace }}/backend/e2e_test_emails.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: pip install -r requirements.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Create restricted database role and E2E database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'mainai_app') THEN
                CREATE ROLE mainai_app LOGIN PASSWORD 'mainai_app_e2e_pw';
              END IF;
            END
            \$\$;
          "
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS lifeos_e2e;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE lifeos_e2e;"
          psql -h localhost -U postgres -d lifeos_e2e -c "
            GRANT USAGE ON SCHEMA public TO mainai_app;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO mainai_app;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO mainai_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO mainai_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO mainai_app;
          "
      - run: alembic upgrade head
        working-directory: backend

      - run: npx next build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8010

      # First pass: functional suites (auth, session-security, account lifecycle) run with
      # a generous login/register rate limit — they are not what's exercising that control
      # (rate-limit.spec.ts is, below) and must not be flaky because of it purely as a side
      # effect of how many /api/auth/login calls the suite happens to make in one window.
      - name: Start backend (functional test mode — generous rate limits)
        working-directory: backend
        env:
          RATE_LIMIT_LOGIN_PER_MINUTE: "1000"
          RATE_LIMIT_REGISTER_PER_MINUTE: "1000"
          RATE_LIMIT_FORGOT_PASSWORD_PER_MINUTE: "1000"
          RATE_LIMIT_RESET_PASSWORD_PER_MINUTE: "1000"
          RATE_LIMIT_VERIFY_EMAIL_PER_MINUTE: "1000"
        run: |
          nohup python scripts/run_e2e_backend.py > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8010/api/health && break
            sleep 1
          done
      - run: npx playwright test e2e/auth.spec.ts e2e/security.spec.ts e2e/account.spec.ts --project=chromium
        working-directory: frontend
      - name: Stop backend
        if: always()
        working-directory: backend
        run: kill "$(cat backend.pid)" 2>/dev/null || true

      # Second pass: rate-limit.spec.ts against the REAL default limits, on a clean backend
      # (fresh Redis counters) so it isn't polluted by the functional passes above.
      - name: Start backend (default rate limits)
        working-directory: backend
        run: |
          redis-cli -h localhost flushdb
          nohup python scripts/run_e2e_backend.py > backend-ratelimit.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8010/api/health && break
            sleep 1
          done
      - run: npx playwright test e2e/rate-limit.spec.ts --project=chromium
        working-directory: frontend
      - name: Stop backend
        if: always()
        working-directory: backend
        run: kill "$(cat backend.pid)" 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: backend/*.log
          retention-days: 14

  # ---------------------------------------------------------------------------------------
  # Single required status check for branch protection — see docs/OPERATIONS.md for how to
  # wire "Require status checks to pass before merging" to this job.
  # ---------------------------------------------------------------------------------------
  all-checks-passed:
    name: All required checks passed
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - npm-audit
      - frontend-build
      - backend-tests
      - rls-security-tests
      - account-rate-limit-tests
      - migration-check
      - e2e-tests
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more required checks failed."
            exit 1
          fi
          echo "All required checks passed."
