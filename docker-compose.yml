services:
  postgres:
    # pgvector-enabled Postgres, not the plain official image — matches CI
    # (.github/workflows/ci.yml) and production (Supabase, which has pgvector enabled) so
    # local dev/CI/prod never diverge on this. See backend/app/models/document_chunk.py.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
      POSTGRES_DB: lifeos
      # Consumed by db-init/01-app-role.sh to create the restricted runtime role.
      # POSTGRES_USER is a Postgres superuser and always bypasses Row-Level Security,
      # so the backend must never run request-time queries through it.
      MAINAI_APP_PASSWORD: ${MAINAI_APP_PASSWORD:-mainai_app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    profiles: ["local-llm"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Backs distributed rate limiting (app/limiter.py) — required as soon as more than one
    # backend replica runs, since slowapi's in-memory fallback is process-local and
    # wouldn't enforce a shared limit across instances. AOF persistence so limiter counters
    # survive a Redis restart rather than silently resetting every client's window.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    # Local-dev SMTP catcher: set SMTP_HOST=mailhog in .env to actually receive
    # verification/reset-password emails during development instead of relying on the
    # (deliberately token-free) log line app/email.py prints when SMTP isn't configured at
    # all. Web UI at http://localhost:8025.
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles: ["dev-mail"]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://lifeos:lifeos@postgres:5432/lifeos
      APP_DATABASE_URL: postgresql://mainai_app:${MAINAI_APP_PASSWORD:-mainai_app}@postgres:5432/lifeos
      OLLAMA_BASE_URL: http://ollama:11434
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_API_URL deliberately left unset here — the browser calls this same
      # server's own /api/* proxy route instead of the backend directly (see
      # frontend/app/api/[...path]/route.ts and lib/api.ts). Only pass it as a build arg for
      # a deployment that wants direct cross-origin calls instead.
    restart: unless-stopped
    environment:
      # Plain runtime env var, read server-side per request by the proxy route — never
      # baked into the client bundle, unlike NEXT_PUBLIC_API_URL above.
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  ollama_data:
  redis_data:
